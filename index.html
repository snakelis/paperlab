<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>纸间 · Markdown 排版实验室</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <header class="app-header">
    <div class="brand"><span class="brand-icon">纸</span><div><strong>纸间 <span class="brand-divider">/</span> 排版实验室</strong><small>MARKDOWN TO WECHAT</small></div></div>
    <span class="experiment">独立可行性原型</span>
    <div class="header-actions">
      <button id="import-button" class="button quiet">导入 Markdown</button>
      <button id="download-markdown" class="button quiet">保存 .md</button>
      <button id="download-html" class="button">导出 HTML</button>
      <button id="download-docx" class="button">导出 Word .docx</button>
      <button id="copy" class="button primary">复制公众号格式 <span>↗</span></button>
    </div>
  </header>

  <div class="notice"><span class="live-dot"></span>独立运行 · 不连接发布系统 · 不上传文章到服务器 <span class="notice-end">写好内容，让排版再走一步。</span></div>

  <main>
    <aside class="settings" aria-label="排版设置">
      <div class="settings-title"><span>排版设置</span><span class="muted">01</span></div>
      <label id="theme-label">文章主题 <span>9 款</span></label>
      <div class="theme-options" aria-labelledby="theme-label"></div>
      <div class="setting-block"><label id="palette-label">主题色 <span>18 款预设</span></label><div id="accent-presets" class="accent-presets" role="group" aria-labelledby="palette-label"></div><label for="accent">自定义主题色</label><div class="color-field"><input type="color" id="accent" value="#087f74"><span id="accent-value">#087F74</span><span id="accent-name">翡翠绿</span></div></div>
      <div class="setting-block"><label for="font">正文字体</label><select id="font"><option value="theme">跟随主题</option><option value="sans">微软雅黑</option><option value="serif">宋体</option><option value="kai">楷体</option><option value="fang">仿宋</option><option value="heiti">黑体</option><option value="deng">等线</option></select></div>
      <div class="setting-block"><label for="codeTheme">代码块配色</label><select id="codeTheme"></select></div>
      <div class="setting-block"><label for="caption">图片说明</label><select id="caption"><option value="none">不显示图注</option><option value="alt">使用图片替代文字 alt</option><option value="title">使用图片标题 title</option></select></div>
      <div class="setting-block"><label for="captionFormat">图注格式</label><select id="captionFormat"><option value="plain">简洁说明</option><option value="numbered">自动编号 · 图 1：说明</option></select></div>
      <div class="setting-block"><label for="paragraphStyle">段落样式</label><select id="paragraphStyle"><option value="normal">标准段落</option><option value="indent">首行缩进两字</option><option value="compact">紧凑段落</option></select></div>
      <div class="setting-block"><label for="font-size">正文字号 <output id="font-size-value">16 px</output></label><input type="range" id="font-size" min="12" max="24" value="16" step="1"><div class="range-labels"><span>紧凑</span><span>舒展</span></div></div>
      <div class="setting-block"><label for="line-height">行间距</label><select id="line-height"><option value="1.5">精简 · 1.5</option><option value="1.7">紧凑 · 1.7</option><option value="1.9" selected>舒适 · 1.9</option><option value="2.1">宽松 · 2.1</option><option value="2.3">疏朗 · 2.3</option></select></div>
      <div class="setting-block"><label for="preview-width">预览宽度</label><select id="preview-width"><option value="375" selected>手机 · 375 px</option><option value="480">大屏 · 480 px</option><option value="680">阅读 · 680 px</option></select></div>
      <label class="checkbox-label"><input type="checkbox" id="footnotes" checked><span>外链转换为文末引用</span></label>
      <div class="setting-block"><button id="reset-layout" class="button">重置排版</button><button id="download-config" class="button">保存 AI 配置</button></div>
      <div class="settings-bottom"><b>从内容到成品</b><p>编辑 / 插图 → 预览 → 导出 Word</p><p>图片与基础排版一起写入 DOCX。公众号导入后的最终样式仍需核对。</p></div>
    </aside>

    <section class="workspace">
      <div class="document-heading"><div class="document-label">当前文稿 <span>本机浏览器自动保存</span></div><label for="title" class="sr-only">文章标题</label><input id="title" type="text" placeholder="给文章起一个标题" maxlength="200"><div class="document-meta"><span id="word-count">—</span><span id="save-state">准备载入</span><button id="sample-button">恢复示例文章</button></div></div>
      <div class="editor-grid">
        <section class="editor-pane"><div class="pane-toolbar"><strong><span class="pane-dot"></span>Markdown</strong><div><button id="image-button">插入图片</button><button id="table-button">插入表格</button></div></div><label for="editor" class="sr-only">Markdown 正文</label><textarea id="editor" spellcheck="false" placeholder="从这里开始写作；也可粘贴或拖入图片……"></textarea><footer class="pane-footer"><span>图片支持选择 / 粘贴 / 拖放</span><span>MD</span></footer></section>
        <section class="preview-pane"><div class="pane-toolbar"><strong><span class="pane-dot green"></span>公众号预览</strong><span id="preview-size">375 px</span></div><div class="preview-scroll"><div class="paper"><div class="paper-eyebrow">ARTICLE PREVIEW <span>●</span></div><article id="preview" class="article" data-theme="journal"></article><div class="paper-end">· END ·</div></div></div><footer class="pane-footer"><span>图文完整预览 · 支持 Word 导出</span><span>DOCX / HTML</span></footer></section>
      </div>
    </section>
  </main>
  <input id="import-file" type="file" accept=".md,.markdown,text/markdown,text/plain" hidden>
  <input id="image-file" type="file" accept="image/png,image/jpeg,image/webp,image/gif" multiple hidden>
  <div id="status" role="status" aria-live="polite" hidden></div>
  <script type="importmap">{"imports":{"docx":"./node_modules/docx/dist/index.mjs","docx/math":"./node_modules/docx/dist/math.mjs"}}</script>
  <script type="module" src="./app.js"></script>
</body>
</html>
